{% extends 'home/components/dashboard_base.html' %} {% block title %}Khata - Genfin{% endblock %}
{%block body %}

<style>
  .item-hover-effect:hover {
    color: #3e3c50;
    background-color: #feebc1;
    border: solid 3px #3e3c50;
  }
  .quantitybutton {
    width: 20px;
    height: 20px;
    margin: 5px;
  }
</style>

<div class="row-1 m-4">
  <h2 class="text-left text-white m-auto">Khata</h2>
</div>

<div class="row m-4 justify-content-between">
  <div class="col-5">
    <div class="input-group">
      <input
        type="text"
        id="name"
        placeholder="Type a username"
        class="mb-3 px-4 py-2 rounded-3 border border-0"
        maxlength="20"
        autocomplete="off"
      />
      <ul
        class="list-group position-absolute bg-white shadow-lg mt-5"
        id="userList"
        style="z-index: 1000; width: 40vh"
      ></ul>
    </div>
  </div>

  <div class="col-3 text-end">
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addUserModal">
      Add User
    </button>
  </div>
</div>

<!-- Add User Modal -->
<div
  class="modal fade"
  id="addUserModal"
  tabindex="-1"
  aria-labelledby="addUserModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addUserModalLabel">Add New User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="addUserForm">
          {% csrf_token %}
          <div class="mb-3">
            <label for="userName" class="form-label">Name</label>
            <input type="text" class="form-control" id="userName" name="name" required />
          </div>
          <div class="mb-3">
            <label for="userNumber" class="form-label">Phone Number</label>
            <input
              type="tel"
              class="form-control"
              id="userNumber"
              name="number"
              pattern="03[0-9]{9}"
              maxlength="11"
              placeholder="03XXXXXXXXX"
              title="Please enter a valid 11-digit number starting with 03"
              required
            />
          </div>
          <div class="mb-3">
            <label for="userAddress" class="form-label">Address</label>
            <input type="text" class="form-control" id="userAddress" name="address" />
          </div>
          <button type="submit" class="btn btn-primary" id="addUserSubmit">Save</button>
          <script>
            $("#addUserForm").on("submit", function (e) {
              dd = {};
              try {
                dd = {
                  name: $("#userName").val(),
                  phone: $("#userNumber").val(),
                  address: $("#userAddress").val(),
                  csrfmiddlewaretoken: $("input[name=csrfmiddlewaretoken]").val(),
                };
              } catch (e) {}
              console.log(dd);
              e.preventDefault();
              $.ajax({
                url: "{% url 'add_user' %}",
                method: "POST",
                data: dd,
                success: function (response) {
                  if (response.status === "success") {
                    Swal.fire({
                      icon: "success",
                      title: "Success",
                      text: "User added successfully!",
                    });
                    $("#addUserModal").modal("hide");
                    $("#addUserForm")[0].reset();
                  } else {
                    Swal.fire({
                      icon: "error",
                      title: "Error",
                      text: response.message || "Failed to add user",
                    });
                  }
                },
                error: function () {
                  Swal.fire({
                    icon: "error",
                    title: "Error",
                    text: "Failed to add user",
                  });
                },
              });
            });
          </script>
        </form>
      </div>
    </div>
  </div>
</div>

<div class="row g-3 m-4">
  <!-- Purched Item table on khata-->
  <div class="col-8">
    <table class="table table-hover" id="khataTable">
      <thead class="table-dark">
        <tr>
          <th scope="col">#</th>
          <th scope="col">Total Price</th>
          <th scope="col">Date</th>
          <th scope="col">Quantity</th>
        </tr>
      </thead>
      <tbody class="table-gray">
        <!-- Data will be dynamically inserted here -->
      </tbody>
    </table>
  </div>

  <div class="col-3 align-content-between me-5">
    <!-- User info-->
    <div class="row-cols-1">
      <table class="table table-hover" id="userInfoTable">
        <thead class="table-dark">
          <tr>
            <th scope="col">User Info</th>
          </tr>
        </thead>
        <tbody class="currentuserInfo">
          <!-- Data will be dynamically inserted here -->
        </tbody>
      </table>
    </div>

    <!--Khata calculation-->
    <div class="row-cols-1 mt-2">
      <table class="table table-hover" id="khataCalculationTable">
        <thead class="table-dark">
          <tr>
            <th scope="col">Khata Calculation</th>
          </tr>
        </thead>
        <tbody>
          <!-- Data will be dynamically inserted here -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
  $(document).ready(function () {
    current_selected_user = [];
    // show user on type
    $("#name").on("input", function () {
      var userList = $("#userList"); // serched user name list
      var search_name = $(this).val().toLowerCase(); // search name
      userList.empty();

      if (search_name.length > 0) {
        $.ajax({
          url: "{% url 'get_user' %}",
          data: { username: search_name },
          success: function (response) {
            if (response.data && response.data.length > 0) {
              response.data.forEach(function (user) {
                userList.append(
                  '<div class="list-group-item item-hover-effect" > <li class="name">' +
                    user[0] +
                    '  </li> <li class="number"> \t' +
                    user[1] +
                    "</li> </div>"
                );
              });
            } else {
              userList.empty();
            }
          },
          error: function (xhr, status, error) {
            console.log("Error: " + error);
          },
        });
      }
    });

    // selectng a user
    $("#userList").on("click", ".list-group-item", function () {

            </div>

          `);

      // Get user loan data

        },
        success: function (response) {
          if (response.empty) {

              const tbody = $("#khataTable tbody");
              tbody.empty();
              console.log(data.sales);
              data.sales.forEach((item, index) => {
                tbody.append(`
                  <tr id={{item.id}}>

                    <td> ${Object.values(item.items).length}

                       0

                  </td>
                  </tr>
                
                `);
              });

              // Add click handler for table rows
              tbody.on("click", "tr", function () {

                // First, fetch the items for this sale
              });
            } else {
              console.log("No user found");
              Swal.fire({
                icon: "error",
                title: "User Not Found",
                text: "No loan data found for this user",

            }
          }
        },
        error: function (xhr, status, error) {
          console.log("Error fetching loan data:", error);
        },
      });
    });
  });
</script>
{% endblock %}
